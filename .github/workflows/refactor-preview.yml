name: Refactor preview safely

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-migracion-preview
          fetch-depth: 1
      - name: Refactor HTML safely
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, html, re
          index=Path('index.html'); text=index.read_text(encoding='utf-8')
          css=Path('css'); js=Path('js'); img=Path('img')
          css.mkdir(exist_ok=True); js.mkdir(exist_ok=True); img.mkdir(exist_ok=True)
          tmp=css/'refactor-test.css'
          if tmp.exists(): tmp.unlink()
          n=[0]
          def style(m):
              body=m.group('body')
              if not body.strip(): return ''
              n[0]+=1; p=css/f'style-{n[0]:02d}.css'; p.write_text(body,encoding='utf-8')
              return f'<link rel="stylesheet" href="/css/{p.name}">'
          text=re.sub(r'<style(?P<attrs>[^>]*)>(?P<body>.*?)</style>',style,text,flags=re.I|re.S)
          j=[0]
          def script(m):
              attrs,body=m.group('attrs'),m.group('body')
              if not body.strip() or re.search(r'\bsrc\s*=',attrs,re.I): return m.group(0)
              typ=re.search(r'\btype\s*=\s*(["\'])(.*?)\1',attrs,re.I|re.S)
              if typ and typ.group(2).strip().lower() in {'application/ld+json','application/json','importmap'}: return m.group(0)
              j[0]+=1; p=js/f'inline-{j[0]:02d}.js'; p.write_text(body,encoding='utf-8')
              return f'<script src="/js/{p.name}"></script>'
          text=re.sub(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',script,text,flags=re.I|re.S)
          seen={}
          def image(m):
              payload=m.group(1); h=hashlib.sha256(payload.encode()).hexdigest()[:16]
              if h not in seen:
                  name=f'embedded-{h}.webp'; (img/name).write_bytes(base64.b64decode(payload)); seen[h]=f'/img/{name}'
              return seen[h]
          text=re.sub(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',image,text,flags=re.I)
          index.write_text(text,encoding='utf-8')
          print('CSS',n[0],'JS',j[0],'images',len(seen),'HTML bytes',index.stat().st_size)
          PY
          test -s index.html
          grep -qi '<title' index.html
          grep -qi 'canonical' index.html
          grep -q 'application/ld+json' index.html
          ! grep -q 'data:image/webp;base64,' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html css js img
          git add -u
          git commit -m "refactor(preview): extract CSS JS and embedded images"
          git push origin HEAD:seo-migracion-preview
          rm -f .github/workflows/refactor-preview.yml
